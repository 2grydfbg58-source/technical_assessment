resources:
  jobs:
    amsterdam_investment_pipeline:
      name: amsterdam-investment-pipeline-${bundle.target}
      performance_target: STANDARD
      environments:
        - environment_key: pipeline
          spec:
            environment_version: "5"
            dependencies:
              - pandas==2.2.3
              - pyarrow==21.0.0
              - shapely==2.2.0
      tasks:
        - task_key: run_pipeline
          environment_key: pipeline
          notebook_task:
            notebook_path: ${workspace.file_path}/notebooks/run_pipeline
            base_parameters:
              root: ${workspace.file_path}
              kamernet_source: ""
              airbnb_source: ""
              postcode_geojson: ""
              amsterdam_geojson: ""
              output_dir: ""
              property_table: amsterdam_property_revenue
              postcode_table: amsterdam_postcode_revenue
              comparison_table: amsterdam_source_comparison
              kamernet_bronze_table: amsterdam_kamernet_bronze
              airbnb_bronze_table: amsterdam_airbnb_bronze
              kamernet_silver_table: amsterdam_kamernet_silver
              airbnb_silver_table: amsterdam_airbnb_silver
              quality_table: amsterdam_pipeline_quality
