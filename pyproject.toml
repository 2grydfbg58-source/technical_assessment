[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "amsterdam-investment"
version = "0.1.0"
description = "Amsterdam rental revenue data pipeline and gold exports"
requires-python = ">=3.9"
dependencies = ["pandas", "pyarrow", "shapely"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
